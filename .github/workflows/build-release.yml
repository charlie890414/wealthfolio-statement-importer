name: Build and release addon

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-scripts

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build bundle
        run: pnpm bundle

      - name: Upload addon package
        uses: actions/upload-artifact@v4
        with:
          name: addon-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download addon package
        uses: actions/download-artifact@v4
        with:
          name: addon-package
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_file="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip_file"
          gh release create "$GITHUB_REF_NAME" "$zip_file" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
